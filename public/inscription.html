<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Cashevent School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=3">
<link rel="stylesheet" href="/css/ecole.css?v=3">
<link rel="stylesheet" href="/css/accueil.css?v=3">
<link rel="stylesheet" href="/css/mobile.css?v=3">
</head>
<body class="page-nf">

<div class="nf-auth">
  <div class="collage" aria-hidden="true"><div class="grille" id="collage"></div></div>
  <div class="voile" aria-hidden="true"></div>

  <div class="nf-tete">
    <a href="/accueil.html" class="brand"><b>CASHEVENT</b><em>School</em></a>
    <div class="nf-actions">
      <a class="nf-bouton fantome" href="/connexion.html">S’identifier</a>
    </div>
  </div>

  <div class="carte">
    <h1>Créer un compte</h1>

    <p class="nf-erreur" id="erreur" hidden></p>

    <form id="formInscription" novalidate>
      <div class="nf-roles" id="choixRole">
        <label class="actif"><input type="radio" name="role" value="eleve" checked>
          <b>Je suis élève</b><small>J’étudie le programme</small></label>
        <label><input type="radio" name="role" value="parent">
          <b>Je suis parent</b><small>Je suis la progression</small></label>
      </div>

      <div class="nf-champ">
        <input id="nom" name="nom" type="text" placeholder=" " autocomplete="name" required>
        <label for="nom">Nom complet</label>
      </div>
      <div class="nf-champ">
        <input id="email" name="email" type="email" placeholder=" " autocomplete="email" required>
        <label for="email">Adresse e-mail</label>
      </div>
      <div class="nf-champ">
        <input id="motDePasse" name="motDePasse" type="password" placeholder=" " minlength="8"
          autocomplete="new-password" required>
        <label for="motDePasse">Mot de passe</label>
        <span class="indice">8 caractères minimum.</span>
      </div>
      <div class="nf-champ" id="champEnfant" hidden>
        <input id="emailEnfant" name="emailEnfant" type="email" placeholder=" ">
        <label for="emailEnfant">Adresse e-mail de votre enfant (facultatif)</label>
        <span class="indice">Son compte élève sera rattaché au vôtre immédiatement.</span>
      </div>

      <button class="nf-soumettre" type="submit">Créer mon compte</button>
    </form>

    <p class="nf-bas">Déjà inscrit ? <a href="/connexion.html">S’identifier.</a></p>
    <p class="nf-mention">En créant un compte, vous acceptez les conditions d’utilisation
    de Cashevent School.</p>
  </div>
</div>

<script src="/js/api.js?v=3"></script>
<script src="/js/accueil.js?v=3"></script>
<script src="/js/connexion.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S’identifier — Cashevent School</title>
<meta name="description" content="Connectez-vous à votre espace Cashevent School : élève, parent ou administration.">
<link rel="canonical" href="https://cashevent.education/connexion">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cashevent School">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="S’identifier — Cashevent School">
<meta property="og:description" content="Connectez-vous à votre espace Cashevent School : élève, parent ou administration.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=3">
<link rel="stylesheet" href="/css/ecole.css?v=3">
<link rel="stylesheet" href="/css/accueil.css?v=3">
<link rel="stylesheet" href="/css/pages.css?v=3">
<link rel="stylesheet" href="/css/mobile.css?v=3">
</head>
<body class="page-nf">

<div class="nf-auth">
  <div class="collage" aria-hidden="true"><div class="grille" id="collage"></div></div>
  <div class="voile" aria-hidden="true"></div>

  <div class="nf-tete">
    <a href="/accueil" class="brand"><b>CASHEVENT</b><em>School</em></a>
  </div>

  <div class="carte">
    <h1>S’identifier</h1>

    <p class="nf-erreur" id="erreur" hidden></p>

    <form id="formConnexion" novalidate>
      <!-- Pré-remplis avec le compte élève de démonstration : il suffit de cliquer. -->
      <div class="nf-champ">
        <input id="email" name="email" type="email" placeholder=" " autocomplete="email"
          value="yasmine@cashevent.education" required>
        <label for="email">Adresse e-mail</label>
      </div>
      <div class="nf-champ">
        <input id="motDePasse" name="motDePasse" type="password" placeholder=" "
          autocomplete="current-password" value="eleve1234" required>
        <label for="motDePasse">Mot de passe</label>
      </div>
      <button class="nf-soumettre" type="submit">S’identifier</button>
    </form>

    <p class="nf-bas">Nouveau sur Cashevent School ? <a href="/inscription">Inscrivez-vous.</a></p>
    <p class="nf-mention">Cette page est protégée : vos identifiants circulent chiffrés et votre
    session est conservée sur cet appareil pendant sept jours.</p>

    <div class="nf-demo">
      <p>Comptes de démonstration</p>
      <div class="lignes">
        <button type="button" data-demo="yasmine@cashevent.education|eleve1234">Élève</button>
        <button type="button" data-demo="parent@cashevent.education|parent1234">Parent</button>
        <button type="button" data-demo="admin@cashevent.education|admin1234">Administrateur</button>
      </div>
    </div>
  </div>
</div>
<script src="/js/pied.js?v=3"></script>

<script src="/js/api.js?v=3"></script>
<script src="/js/accueil.js?v=3"></script>
<script src="/js/connexion.js?v=3"></script>

<script>
/* Filet de sécurité : si le script externe n'a pas pu s'exécuter (version en cache,
   extension qui bloque, réseau), le formulaire ne doit jamais repartir en soumission
   HTML — cela rechargerait la page avec le mot de passe dans l'adresse. */
(function () {
  var f = document.getElementById('formConnexion');
  if (!f) return;
  f.addEventListener('submit', function (e) {
    if (window.__connexionPrete) return;   /* le script principal s'en charge déjà */
    e.preventDefault();
    var bouton = f.querySelector('[type=submit]');
    bouton.disabled = true;
    fetch('/api/auth/connexion', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: f.email.value, motDePasse: f.motDePasse.value })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, corps: j }; });
    }).then(function (x) {
      if (!x.ok) throw new Error(x.corps.erreur || 'Connexion impossible.');
      var cible = { eleve: '/ecole', parent: '/espace-parent', admin: '/admin' };
      location.href = cible[x.corps.utilisateur.role] || '/';
    }).catch(function (err) {
      var zone = document.getElementById('erreur');
      if (zone) { zone.textContent = err.message; zone.hidden = false; }
      bouton.disabled = false;
    });
  });
})();
</script>
</body>
</html>
